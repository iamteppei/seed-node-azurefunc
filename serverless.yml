# Welcome to Serverless!
#
# This file is the main config file for your service.
# It's very minimal at this point and uses default values.
# You can always add more config options for more control.
# We've included some commented out config examples here.
# Just uncomment any of them to get that config option.
#
# For full config options, check the docs:
#    docs.serverless.com
#
# Happy Coding!

service: your-service # follow Azure naming convention

# You can pin your service to only deploy with a specific Serverless version
# Check out our docs for more details
# frameworkVersion: "=X.X.X"

custom:
  webpack:
    webpackConfig: ./webpack.config.js
    includeModules: true

provider:
  name: azure
  region: West US 2
  runtime: nodejs12
  # os: windows  # windows is default, linux is available
  prefix: ${opt:prefix, 'dev'}  # prefix of generated resource name
  # subscriptionId: A356AC8C-E310-44F4-BF85-C7F29044AF99
  stage: ${opt:stage, 'dev'}
  # type: premium  # premium azure functions
  environment: ${file(./serverless.env.${opt:env, 'default'}.yml)} # these will be created as application settings
  # you can define apim configuration here
  apim:
    apis:
      - name: core-api
        subscriptionRequired: false # if true must provide an api key
        displayName: Core API
        description: Core API
        protocols:
          - https
          - http # TODO remove http later
        path: core
        tags:
          - core_api
        authorization: none
        sku: Basic_1 # TODO change this on staging and production
    backends:
      - name: core-api-backend
        url: core # point to api azure function
    cors:
      allowCredentials: false
      allowedOrigins:
        - "*" # TODO change this to real domain name
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
      allowedHeaders:
        - "*"
      exposeHeaders:
        - "*"

plugins:
  - serverless-azure-functions
  - serverless-webpack

functions:
  coreApi: 
    handler: src/functions/api.handler
    name: $return
    events:
      - http:
          method: ANY
        route: core/{*restOfPath}
        authLevel: anonymous
    apim:
      api: core-api
      backend: core-api-backend
      operations:
        - method: GET
          urlTemplate: /projects/{projectId}/models/{modelId}
          displayName: getModelDetail
          templateParameters:
            - name: projectId
              type: string
            - name: modelId
              type: string             
